# Netlify Configuration for Universal TV Remote
[build]
  base = "client"
  publish = "dist"
  command = "npm run build"

# Single-Page Application routing redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Android APK file delivery headers
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"universal-tv-remote.apk\""
    Cache-Control = "public, max-age=31536000, immutable"

# Cache hashed Vite production assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
