<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nokia TV Cloud Companion Receiver</title>
  <style>
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .badge {
      background: #1e293b;
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 24px;
      border: 1px solid #334155;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 32px 48px;
      border-radius: 24px;
      max-width: 500px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    h1 { margin: 0 0 12px 0; font-size: 28px; }
    p { color: #94a3b8; font-size: 16px; line-height: 1.5; margin: 0 0 24px 0; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: bold;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #eab308;
    }
    .dot.connected { background: #22c55e; }
    .last-cmd {
      margin-top: 24px;
      font-family: monospace;
      padding: 12px 16px;
      background: #1e293b;
      border-radius: 12px;
      font-size: 14px;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Nokia Android TV Cloud Receiver</div>
    <h1>Universal Remote Bridge</h1>
    <p>Keep this tab open or pinned in your TV browser to receive real-time commands from your phone remote.</p>
    <div class="status">
      <span id="dot" class="dot"></span>
      <span id="status-text">Connecting to Render Cloud...</span>
    </div>
    <div id="cmd-box" class="last-cmd">Waiting for commands...</div>
  </div>

  <script>
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${window.location.host}/ws/tv-companion?deviceId=nokia-tv`;
    
    function connect() {
      const dot = document.getElementById('dot');
      const statusText = document.getElementById('status-text');
      const cmdBox = document.getElementById('cmd-box');

      const ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        dot.className = 'dot connected';
        statusText.innerText = 'Connected & Listening to Remote!';
        cmdBox.innerText = 'Ready for button presses.';
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'REMOTE_COMMAND') {
            cmdBox.innerText = `Command Received: ${data.command} ${data.payload ? JSON.stringify(data.payload) : ''}`;
            
            // Handle App Launches
            if (data.command === 'LAUNCH_APP' && data.payload?.app) {
              const app = data.payload.app.toLowerCase();
              if (app.includes('youtube')) window.location.href = 'https://www.youtube.com/tv';
              if (app.includes('netflix')) window.location.href = 'https://www.netflix.com';
              if (app.includes('prime')) window.location.href = 'https://www.primevideo.com';
            }
          }
        } catch (e) {
          console.error(e);
        }
      };

      ws.onclose = () => {
        dot.className = 'dot';
        statusText.innerText = 'Reconnecting in 3s...';
        setTimeout(connect, 3000);
      };
    }

    connect();
  </script>
</body>
</html>
