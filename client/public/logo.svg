<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Chassis Gradient -->
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2538" />
      <stop offset="50%" stop-color="#121622" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>

    <!-- Glowing Cyber Rim Gradient -->
    <linearGradient id="rimGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="80%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#FF3366" />
    </linearGradient>

    <!-- Signal Arc Gradient -->
    <linearGradient id="signalGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="1" />
    </linearGradient>

    <!-- Core Disc Gradient -->
    <radialGradient id="coreDisc" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="85%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </radialGradient>

    <!-- Glass Glint Gradient -->
    <linearGradient id="glassGlint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#00F2FE" flood-opacity="0.35" />
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Outer Chassis Squircle -->
  <rect x="36" y="36" width="440" height="440" rx="110" fill="url(#chassisGrad)" stroke="url(#rimGlow)" stroke-width="4.5" filter="url(#shadow)" />

  <!-- 2. Concentric Precision Tech Grid -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1.5">
    <circle cx="256" cy="256" r="180" fill="none" stroke-dasharray="6,6" />
    <circle cx="256" cy="256" r="130" fill="none" />
    <circle cx="256" cy="256" r="80" fill="none" stroke-dasharray="4,4" />
    <line x1="76" y1="256" x2="436" y2="256" />
    <line x1="256" y1="76" x2="256" y2="436" />
  </g>

  <!-- 3. Radiating Wi-Fi / Smart TV LAN Waves (Top Beam) -->
  <g filter="url(#coreGlow)">
    <!-- Wave 3 (Outer) -->
    <path d="M 176 156 A 114 114 0 0 1 336 156" fill="none" stroke="url(#signalGrad)" stroke-width="8" stroke-linecap="round" opacity="0.4" />
    <!-- Wave 2 (Middle) -->
    <path d="M 204 186 A 74 74 0 0 1 308 186" fill="none" stroke="url(#signalGrad)" stroke-width="9" stroke-linecap="round" opacity="0.75" />
    <!-- Wave 1 (Inner) -->
    <path d="M 232 216 A 34 34 0 0 1 280 216" fill="none" stroke="#00F2FE" stroke-width="10" stroke-linecap="round" opacity="0.95" />
  </g>

  <!-- 4. Tactile Directional Facets (The Precision D-Pad) -->
  <g filter="url(#shadow)">
    <!-- Up Facet -->
    <path d="M 256 168 L 292 208 L 220 208 Z" fill="#1E293B" stroke="rgba(255,255,255,0.18)" stroke-width="2" />
    <!-- Down Facet -->
    <path d="M 256 344 L 292 304 L 220 304 Z" fill="#1E293B" stroke="rgba(255,255,255,0.18)" stroke-width="2" />
    <!-- Left Facet -->
    <path d="M 168 256 L 208 220 L 208 292 Z" fill="#1E293B" stroke="rgba(255,255,255,0.18)" stroke-width="2" />
    <!-- Right Facet -->
    <path d="M 344 256 L 304 220 L 304 292 Z" fill="#1E293B" stroke="rgba(255,255,255,0.18)" stroke-width="2" />
  </g>

  <!-- 5. Embossed Center Core Disc -->
  <circle cx="256" cy="256" r="42" fill="url(#coreDisc)" stroke="#7DD3FC" stroke-width="2.5" filter="url(#coreGlow)" />
  <!-- Core Inner Pulse Glow -->
  <circle cx="256" cy="256" r="16" fill="#FFFFFF" opacity="0.95" />

  <!-- 6. Bottom TV Bevel Aperture -->
  <g opacity="0.8">
    <rect x="206" y="380" width="100" height="12" rx="6" fill="#0284C7" />
    <circle cx="256" cy="386" r="3" fill="#00F2FE" />
  </g>

  <!-- 7. Specular Top Glass Arc -->
  <path d="M 36 146 C 36 85 85 36 146 36 L 366 36 C 427 36 476 85 476 146 L 476 210 C 370 170 140 170 36 210 Z" fill="url(#glassGlint)" />
</svg>
